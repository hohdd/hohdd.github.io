# Plugins
plugins:
  - jekyll-paginate-v2

# TOC Configuration
toc:
  min_level: 1
  max_level: 6
  no_toc_section_class: no_toc_section
  list_class: 'toc-nav dh-black-8 w3-animate-opacity dh-padding-right-1em' # <ul class="section-nav"> ROOT
  sublist_class: ''
  item_class: toc-entry # <li class="toc-entry toc-h1">
  item_prefix: toc- # toc-h1, toc-h2, toc-h3...

# Compress HTML
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: [html, head, body]

# Pagination => https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md
# paginate: 15
# paginate_path: /page:num/
############################################################
# Site configuration for the Jekyll 3 Pagination Gem
# The values here represent the defaults if nothing is set
pagination:
  
  # Site-wide kill switch, disabled here it doesn't run at all 
  enabled: true

  # Set to 'true' to enable pagination debugging. This can be enabled in the site config or only for individual pagination pages
  debug: false

  # The default document collection to paginate if nothing is specified ('posts' is default)
  collection: 'posts'

  # How many objects per paginated page, used to be `paginate` (default: 0, means all)
  per_page: 10

  # The permalink structure for the paginated pages (this can be any level deep)
  permalink: '/page/:num.html' # Pages are index.html inside this folder (default)
  #permalink: '/page/:num.html' # Pages are simple html files 
  #permalink: '/page/:num' # Pages are html files, linked jekyll extensionless permalink style.

  # Optional the title format for the paginated pages (supports :title for original page title, :num for pagination page number, :max for total number of pages)
  title: ':title (page :num of :max)'

  # Limit how many pagenated pages to create (default: 0, means all)
  limit: 0
  
  # Optional, defines the field that the posts should be sorted on (omit to default to 'date')
  sort_field: 'date'

  # Optional, sorts the posts in reverse order (omit to default decending or sort_reverse: true)
  sort_reverse: true

  # Optional, the default category to use, omit or just leave this as 'posts' to get a backwards-compatible behavior (all posts)
  category: 'posts'

  # Optional, the default tag to use, omit to disable
  tag: ''

  # Optional, the default locale to use, omit to disable (depends on a field 'locale' to be specified in the posts, 
  # in reality this can be any value, suggested are the Microsoft locale-codes (e.g. en_US, en_GB) or simply the ISO-639 language code )
  locale: '' 

 # Optional,omit or set both before and after to zero to disable. 
 # Controls how the pagination trail for the paginated pages look like. 
  trail: 
    before: 2
    after: 3

  # Optional, the default file extension for generated pages (e.g html, json, xml).
  # Internally this is set to html by default
  extension: html

  # Optional, the default name of the index file for generated pages (e.g. 'index.html')
  # Without file extension
  # indexpage: 'index'

defaults:
  - scope:
      path: "" # Áp dụng cho tất cả các tệp
      # type: "posts" # Áp dụng cho kiểu posts
    values:
      ### Ghi đè mỗi khi viết bài
      layout: "post"
      header: "HUMAN: title trong content" # không có header sẽ lấy title (admin page) và cũng là document.title
      category: "Chưa phân loại" # lựa chọn MỘT category phù hợp (chỉ MỘT)
      ### Các tùy chọn có thể bật
      toc: false # Table of content (TOC mặc định false)
      embquiz: false # Chỉ có sẵn trong collections và mindmap vì đi kèm include quiz-with-selected-text.html
      mermaid: false # có sử dụng mermaid không? (sequenceDiagram, flowchart, mindmap)
      mindmap: false # yêu cầu mermaid cũng là true
      highlight: false # thêm màu mè cho code
      audioSetting: false # trên navbar có hiển thị audioSetting ko?
      quickNote: false # trên navbar có hiển thị quickNote ko?
      highlight_text: false # highlight text băng JS, khi TRUE đi kèm với highlight_yellow, highlight_green, highlight_red, highlight_gray
      glslEditor: false # nhúng glslEditor trong bài viết
      mathjax: false # nhúng ký tự toán học
      sticky: false # đưa bài viết hiển thị ngoài home
      exclude: false # không bao gồm trong kết quả tìm kiếm và sitemap. Tìm kiếm đang có ở index, 404, collection page, collection post, archives.
      ### Menu phụ thêm trên navbar
      secondMenu: false
      secondMenuIcon: "gamepad" # material icon, đi kèm secondMenu: true
      secondMenuHandler: "toggleColumnTables('1 2')" # đi kèm secondMenu: true
      thirdMenu: false
      thirdMenuIcon: "extension" # material icon, đi kèm thirdMenu: true
      thirdMenuHandler: "toggleExceptKanji()" # đi kèm thirdMenu: true
      ### Gần như là không bao giờ sử dụng/thay đổi
      author: "Dong Ho"
      date: "2017-06-13 22:26:14 +0700"
      konami: true # mặc định true (chỉ có tác dụng trên tools để control ẩn/hiện trên page tools.html
      # categories: "cat01 cat02" # tách nhau bởi dấu cách, ko sử dụng dấu ngoặc kép được nên phải viết liền.
      # coverImg: "/assets/img/articles/demo/girl_hat.jpg" # Ảnh cover đầu bài viết. Áp dụng cho posts/collections/mindmap với size: 1068x703 | 900x500 | 600x400
      # effect: true # sử dụng hiệu ứng "w3-image img-sepia"? đi kèm với coverImg
      # thumbnailImg: "https://picsum.photos/900/500?grayscale" # Ảnh thumbnailImg ở trang home, chỉ có tác dụng nếu sticky true
      ### Thuộc tính khác không liên quan, chỉ liệt kê mang tính tổng hợp
      # show: true # page.show sử dụng để quyết định show trong menu hay không. Tương tụ data.menu nhưng không còn dùng
      # collections.isSerial & collections.show trong _config.yml là để nhóm các bài viết collections trong page Collections và index.md trong mỗi Collection